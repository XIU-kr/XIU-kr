<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title">
  <title id="title">XIU — a curious developer from Seoul</title>

  <defs>
    <!-- avatar clip -->
    <clipPath id="avatar-clip"><circle cx="160" cy="160" r="80"/></clipPath>

    <!-- wordmark gradient: gold → light -->
    <linearGradient id="wordmark-grad" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#d4a016"/>
      <stop offset="0.55" stop-color="#f2d67b"/>
      <stop offset="1" stop-color="#e4e4ec"/>
    </linearGradient>

    <!-- ambient radial glow behind the identity -->
    <radialGradient id="glow" cx="0.16" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#d4a016" stop-opacity="0.18"/>
      <stop offset="0.45" stop-color="#d4a016" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#d4a016" stop-opacity="0"/>
    </radialGradient>

    <!-- teal glow far right for secondary warmth -->
    <radialGradient id="glow-teal" cx="0.9" cy="0.08" r="0.4">
      <stop offset="0" stop-color="#2dd4a8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2dd4a8" stop-opacity="0"/>
    </radialGradient>

    <!-- fine dotted grid overlay -->
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#e4e4ec" opacity="0.06"/>
    </pattern>

    <!-- avatar ring gradient -->
    <linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4a016" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#d4a016" stop-opacity="0.25"/>
    </linearGradient>

    <!-- divider gradient -->
    <linearGradient id="divider-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4a016" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#d4a016" stop-opacity="0.6"/>
      <stop offset="0.85" stop-color="#d4a016" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#d4a016" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- stage -->
  <rect width="1200" height="900" fill="#07070b"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect width="1200" height="900" fill="url(#glow-teal)"/>
  <rect width="1200" height="900" fill="url(#dots)"/>

  <!-- inner frame hairline -->
  <rect x="48" y="48" width="1104" height="804"
        fill="none" stroke="#1e1e30" stroke-width="1" rx="2"/>

  <!-- ─── Identity ──────────────────────────────────────────────── -->

  <!-- avatar soft glow -->
  <circle cx="160" cy="160" r="92" fill="#d4a016" opacity="0.12"/>
  <circle cx="160" cy="160" r="86" fill="#07070b"/>

  <!-- avatar image -->
  <image href="data:image/jpeg;base64," x="80" y="80" width="160" height="160"
         clip-path="url(#avatar-clip)" preserveAspectRatio="xMidYMid slice"/>

  <!-- avatar ring -->
  <circle cx="160" cy="160" r="80" fill="none" stroke="url(#ring-grad)" stroke-width="1.6"/>

  <!-- wordmark -->
  <text x="280" y="180" font-family="'Syne','Inter',-apple-system,system-ui,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="120"
        fill="url(#wordmark-grad)" letter-spacing="-2">XIU</text>

  <!-- tagline -->
  <text x="284" y="216" font-family="'Outfit','Inter',-apple-system,system-ui,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19"
        fill="#8a8aa6">a curious developer &#160;·&#160; makes things he wants to use</text>

  <!-- handle -->
  <text x="284" y="244" font-family="'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13"
        fill="#d4a016" letter-spacing="1.2" opacity="0.9">&#x2192;&#160; github.com/XIU-kr</text>

  <!-- divider -->
  <line x1="80" y1="274" x2="1120" y2="274"
        stroke="url(#divider-grad)" stroke-width="1"/>

  <!-- ─── Category grid ────────────────────────────────────────── -->

  <!-- vertical column separator -->
  <line x1="614" y1="300" x2="614" y2="832"
        stroke="#1e1e30" stroke-width="1" opacity="0.8"/>

  <!-- left column: Web Sites -->
  <text x="80" y="306" font-family="'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" letter-spacing="3.4" fill="#d4a016" font-weight="600">WEB SITES</text>
  <text x="84" y="348" font-family="'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="2.4" fill="#2dd4a8" opacity="0.85">&#8213;&#160;&#160; personal</text>
  <text x="102" y="376" font-family="'Outfit','Inter',-apple-system,system-ui,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16.5" fill="#e4e4ec" font-weight="500">xiu.kr<tspan fill="#8a8aa6" font-weight="400">&#160;&#160;&#8212;&#160;&#160;personal portfolio</tspan></text>
  <text x="102" y="404" font-family="'Outfit','Inter',-apple-system,system-ui,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16.5" fill="#e4e4ec" font-weight="500">quon.xiu.kr<tspan fill="#8a8aa6" font-weight="400">&#160;&#160;&#8212;&#160;&#160;free QR code generator</tspan></text>
  <text x="84" y="446" font-family="'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="2.4" fill="#2dd4a8" opacity="0.85">&#8213;&#160;&#160; church</text>
  <text x="102" y="474" font-family="'Outfit','Inter',-apple-system,system-ui,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16.5" fill="#e4e4ec" font-weight="500">dongtanms.kr<tspan fill="#8a8aa6" font-weight="400">&#160;&#160;&#8212;&#160;&#160;Church Site · Rhymix CMS</tspan></text>
  <text x="102" y="502" font-family="'Outfit','Inter',-apple-system,system-ui,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16.5" fill="#e4e4ec" font-weight="500">repentanceheaven.kr<tspan fill="#8a8aa6" font-weight="400">&#160;&#160;&#8212;&#160;&#160;mission organization site</tspan></text>
  <text x="102" y="530" font-family="'Outfit','Inter',-apple-system,system-ui,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16.5" fill="#e4e4ec" font-weight="500">shop.repentanceheaven.kr<tspan fill="#8a8aa6" font-weight="400">&#160;&#160;&#8212;&#160;&#160;online bookstore · WooCommerce</tspan></text>
  <text x="84" y="572" font-family="'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="2.4" fill="#2dd4a8" opacity="0.85">&#8213;&#160;&#160; community</text>
  <text x="102" y="600" font-family="'Outfit','Inter',-apple-system,system-ui,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16.5" fill="#e4e4ec" font-weight="500">cs2.kr<tspan fill="#8a8aa6" font-weight="400">&#160;&#160;&#8212;&#160;&#160;Korea Counter-Strike 2 community</tspan></text>
  <text x="102" y="628" font-family="'Outfit','Inter',-apple-system,system-ui,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16.5" fill="#e4e4ec" font-weight="500">bbangyadan.kr<tspan fill="#8a8aa6" font-weight="400">&#160;&#160;&#8212;&#160;&#160;Valorant clan platform</tspan></text>

  <!-- right column: 5 categories -->
  <text x="640" y="306" font-family="'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" letter-spacing="3.4" fill="#d4a016" font-weight="600">DESKTOP APPS</text>
  <text x="658" y="346" font-family="'Outfit','Inter',-apple-system,system-ui,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16.5" fill="#e4e4ec" font-weight="500">Vora<tspan fill="#8a8aa6" font-weight="400">&#160;&#160;&#8212;&#160;&#160;AI image editing desktop app</tspan></text>
  <text x="640" y="392" font-family="'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" letter-spacing="3.4" fill="#d4a016" font-weight="600">CHURCH APPS</text>
  <text x="658" y="432" font-family="'Outfit','Inter',-apple-system,system-ui,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16.5" fill="#e4e4ec" font-weight="500">Phos<tspan fill="#8a8aa6" font-weight="400">&#160;&#160;&#8212;&#160;&#160;worship PPT auto-generator</tspan></text>
  <text x="658" y="460" font-family="'Outfit','Inter',-apple-system,system-ui,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16.5" fill="#e4e4ec" font-weight="500">Poima<tspan fill="#8a8aa6" font-weight="400">&#160;&#160;&#8212;&#160;&#160;church membership &amp; finance management</tspan></text>
  <text x="640" y="506" font-family="'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" letter-spacing="3.4" fill="#d4a016" font-weight="600">ANDROID APPS</text>
  <text x="658" y="546" font-family="'Outfit','Inter',-apple-system,system-ui,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16.5" fill="#e4e4ec" font-weight="500">Quon<tspan fill="#8a8aa6" font-weight="400">&#160;&#160;&#8212;&#160;&#160;QR code generator</tspan></text>
  <text x="658" y="574" font-family="'Outfit','Inter',-apple-system,system-ui,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16.5" fill="#e4e4ec" font-weight="500">Parking Management<tspan fill="#8a8aa6" font-weight="400">&#160;&#160;&#8212;&#160;&#160;church parking POS &amp; ticketing</tspan></text>
  <text x="658" y="602" font-family="'Outfit','Inter',-apple-system,system-ui,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16.5" fill="#e4e4ec" font-weight="500">Church App<tspan fill="#8a8aa6" font-weight="400">&#160;&#160;&#8212;&#160;&#160;web-based church app</tspan></text>
  <text x="640" y="648" font-family="'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" letter-spacing="3.4" fill="#d4a016" font-weight="600">GAME SERVER PLUGINS</text>
  <text x="658" y="688" font-family="'Outfit','Inter',-apple-system,system-ui,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16.5" fill="#e4e4ec" font-weight="500">GrenadeBoost<tspan fill="#8a8aa6" font-weight="400">&#160;&#160;&#8212;&#160;&#160;custom-physics grenade boosting</tspan></text>
  <text x="658" y="716" font-family="'Outfit','Inter',-apple-system,system-ui,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16.5" fill="#e4e4ec" font-weight="500">AutoRestart<tspan fill="#8a8aa6" font-weight="400">&#160;&#160;&#8212;&#160;&#160;timezone-aware scheduled restart</tspan></text>
  <text x="658" y="744" font-family="'Outfit','Inter',-apple-system,system-ui,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16.5" fill="#e4e4ec" font-weight="500">DU-NicknameSync<tspan fill="#8a8aa6" font-weight="400">&#160;&#160;&#8212;&#160;&#160;Steam ↔ Discord nickname sync</tspan></text>

  <!-- ─── Bottom rule ──────────────────────────────────────────── -->
  <line x1="80" y1="844" x2="1120" y2="844"
        stroke="#1e1e30" stroke-width="1" opacity="0.8"/>

  <text x="80" y="870" font-family="'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11"
        letter-spacing="2.8" fill="#d4a016" opacity="0.85">&#x2192;&#160;&#160; click anywhere to get in touch</text>
  <text x="1120" y="870" text-anchor="end" font-family="'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11"
        letter-spacing="2.8" fill="#8a8aa6" opacity="0.72">xiu.kr</text>
</svg>
